<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stage">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Stagio · Stage</title>
  <!-- Stagio Extra: the stage display. A phone or tablet on the lectern shows the speaker the
       slide on the projector, the next one, the notes, the time left and messages from the
       console. View only; Prev/Next appear only when the console allows them. -->
  <style>
    :root {
      --bg: #0b0c0d; --surface: #131516; --raise: #1c1f21; --line: #24272a; --line-hi: #34393d;
      --text: #eef0f2; --dim: #9aa1a8; --red: #e5484d; --green: #3dd68c; --amber: #f0a020;
      --sans: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei UI", sans-serif;
      --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
      --notes: 28px;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-text-size-adjust: 100%; }
    body { display: flex; flex-direction: column; overflow: hidden; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    button { font: inherit; color: inherit; cursor: pointer; }
    .hidden { display: none !important; }

    .bar { flex: none; display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .part { min-width: 0; flex: 1; display: flex; flex-direction: column; }
    .part small { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .part b { font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .left { font: 600 40px var(--mono); white-space: nowrap; }
    .left.over { color: var(--amber); } .left.late { color: var(--red); }
    .clock { font: 600 22px var(--mono); color: var(--dim); white-space: nowrap; }
    .tb { height: 38px; padding: 0 12px; border: 1px solid var(--line-hi); border-radius: 4px; background: var(--raise); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .tb.lit { border-color: var(--green); color: var(--green); }

    .msg { flex: none; display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: var(--amber); color: #000; font-size: 26px; font-weight: 700; border: 0; width: 100%; text-align: left; }
    .msg span { flex: 1; }
    .msg em { font-style: normal; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .7; white-space: nowrap; }
    .msg.seen { background: #3a3220; color: var(--amber); }

    main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.55fr 1fr; gap: 14px; padding: 14px 16px; }
    .now, .side { min-height: 0; display: flex; flex-direction: column; gap: 10px; }
    .nextbox { flex: none; display: flex; flex-direction: column; gap: 10px; }
    .notesbox { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
    .label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); display: flex; justify-content: space-between; gap: 10px; }
    .label .tally { color: #fff; background: var(--red); padding: 1px 7px; border-radius: 2px; }
    .label .tally.next { background: none; color: var(--green); border: 1px solid var(--green); padding: 0 6px; }
    .frame { position: relative; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line-hi); overflow: hidden; flex: none; }
    .now .frame { border: 2px solid var(--red); }
    .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .frame .ph { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 10px; color: var(--dim); font-size: 22px; }
    .frame .state { position: absolute; inset: 0; display: grid; place-items: center; font: 700 28px var(--sans); letter-spacing: .12em; }
    .frame .state.black { background: #000; color: var(--red); }
    .frame .state.white { background: #f4f4f2; color: #c33; }
    .notes { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--line); background: var(--surface); padding: 12px 14px; font-size: var(--notes); line-height: 1.3; white-space: pre-wrap; }
    .notes:empty::before { content: 'No notes on this slide'; color: var(--dim); font-size: 16px; }
    .sizer { display: flex; gap: 6px; }
    .sizer button { width: 40px; height: 30px; border: 1px solid var(--line-hi); border-radius: 4px; background: var(--raise); font-size: 14px; font-weight: 700; }
    .flip { flex: none; display: grid; grid-template-columns: 1fr 1.6fr; gap: 12px; padding: 0 16px 14px; }
    .flip button { height: 74px; border: 1px solid var(--line-hi); border-radius: 6px; background: var(--raise); font-size: 22px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .flip .go { background: var(--text); color: var(--bg); border-color: var(--text); }

    .wait { flex: 1; display: grid; place-items: center; text-align: center; padding: 20px; }
    .wait h1 { font-size: 34px; margin: 0 0 10px; }
    .wait p { color: var(--dim); font-size: 18px; margin: 0; }

    .flash { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; text-align: center; padding: 6vw; background: var(--amber); color: #000; border: 0; width: 100%; }
    .flash b { font-size: min(11vw, 120px); line-height: 1.1; }
    .flash small { position: absolute; bottom: 5vh; left: 0; right: 0; font-size: 18px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
    .lost { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; text-align: center; background: rgba(11, 12, 13, .92); }
    .lost b { display: block; font-size: 44px; color: var(--red); }
    .lost span { color: var(--dim); font-size: 18px; }

    .login { flex: 1; display: grid; place-items: center; padding: 24px; }
    .login form { width: min(380px, 100%); display: flex; flex-direction: column; gap: 12px; }
    .login h1 { font-size: 24px; margin: 0; }
    .login p { color: var(--dim); margin: 0; }
    .login input { height: 56px; font: 600 28px var(--mono); letter-spacing: .3em; text-align: center; background: var(--surface); color: var(--text); border: 1px solid var(--line-hi); border-radius: 4px; }
    .login button { height: 52px; border: 0; border-radius: 4px; background: var(--text); color: var(--bg); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .login .err { color: var(--red); min-height: 20px; }
    .awake-video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    @media (orientation: portrait), (max-width: 760px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .side { display: grid; grid-template-columns: 0.9fr 1.1fr; align-items: start; }
      .side .nextbox { min-width: 0; }
      .side .notesbox { min-height: 0; height: 100%; display: flex; flex-direction: column; gap: 10px; }
      .left { font-size: 30px; }
      .clock { display: none; }
      .msg { font-size: 22px; }
    }
    @media (max-width: 760px) and (orientation: portrait) {
      .side { grid-template-columns: 1fr; }
      .side .nextbox { display: none; }
    }
  </style>
</head>
<body>
  <!-- sign in with the stage PIN (the console shows it under Remote → Stage display) -->
  <div class="login hidden" id="login">
    <form id="loginForm">
      <h1>Stage display</h1>
      <p>Enter the stage PIN shown on the Stagio computer under Remote.</p>
      <input id="pin" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="••••••">
      <button>Show</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>

  <div class="bar hidden" id="bar">
    <div class="part"><small id="partLabel">Segment</small><b id="partName"></b></div>
    <div class="left" id="left">–</div>
    <div class="clock" id="clock">--:--</div>
    <button class="tb" id="btnAwake" title="Keep this screen on">Awake</button>
    <button class="tb hidden" id="btnFull" title="Full screen">Full</button>
  </div>
  <button class="msg hidden" id="msg"><span id="msgText"></span><em id="msgHint">Tap when seen</em></button>

  <main class="hidden" id="stage">
    <section class="now">
      <div class="label"><span class="tally">On screen</span><span id="nowNum"></span></div>
      <div class="frame"><img id="nowImg" alt=""><div class="ph" id="nowPh"></div><div class="state hidden" id="nowState"></div></div>
    </section>
    <section class="side">
      <div class="nextbox">
        <div class="label"><span class="tally next">Next</span><span id="nextNum"></span></div>
        <div class="frame"><img id="nextImg" alt=""><div class="ph" id="nextPh"></div></div>
      </div>
      <div class="notesbox">
        <div class="label"><span>Notes</span><span class="sizer"><button id="smaller" aria-label="Smaller notes">A−</button><button id="bigger" aria-label="Bigger notes">A+</button></span></div>
        <div class="notes" id="notes"></div>
      </div>
    </section>
  </main>
  <div class="wait hidden" id="wait"><div><h1 id="waitTitle">Waiting for the slide show</h1><p id="waitSub">This screen follows the projector once the show starts.</p></div></div>
  <div class="flip hidden" id="flip"><button id="btnPrev">Prev</button><button class="go" id="btnNext">Next</button></div>

  <button class="flash hidden" id="flash"><b id="flashText"></b><small>Tap when seen</small></button>
  <div class="lost hidden" id="lost"><div><b>Not connected</b><span>Reconnecting to the Stagio computer…</span></div></div>

  <script src="stage.js"></script>
</body>
</html>
