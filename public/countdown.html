<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdown</title>
  <!-- The opening countdown, full screen on the projector (opened by the desktop app for a
       countdown of the run of show, Extra, or the countdown on its own, Standard and Extra).
       Big, plain, readable from the back. -->
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #000; color: #f4f4f2; overflow: hidden; cursor: none;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4vh 6vw; box-sizing: border-box; }
    #title { font-size: 5.2vh; font-weight: 500; letter-spacing: .02em; color: #c9c9c4; min-height: 6vh; margin-bottom: 2vh; }
    #time { font-size: 30vh; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
    #time.done { color: #8a8a85; }
    #notice { font-size: 4.2vh; color: #b3b3ae; min-height: 6vh; margin-top: 5vh; max-width: 80vw; transition: opacity .6s; }
    #notice.out { opacity: 0; }
    .blank #title, .blank #time, .blank #notice { visibility: hidden; }
  </style>
</head>
<body class="blank">
  <main>
    <div id="title"></div>
    <div id="time">0:00</div>
    <div id="notice"></div>
  </main>
  <script src="countdown.js"></script>
</body>
</html>
